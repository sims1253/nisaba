[package]
name = "nisaba-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Loro CRDT WebSocket authority, relay, presence, and snapshot store for Nisaba."

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nisaba-sync"
path = "src/main.rs"

[features]
default = ["server", "s3"]
# Enables the axum HTTP/WebSocket server binary (and the production reqwest HTTP
# transport for JWKS refresh + the document-authorization verifier). Disable for a
# headless library build; the OIDC/JWT resolver and its traits still compile so
# they are testable without a server.
server = [
  "dep:axum",
  "dep:tower",
  "dep:tower-http",
  "dep:tokio-tungstenite",
  "dep:reqwest",
]
# S3-backed op-log/snapshot stores (`S3OpLogStore` / `S3SnapshotStore`). The
# filesystem and in-memory stores are always available; this adds the
# object-store adapter the production compose stack wires in. The aws-sdk
# feature set mirrors the app service's exactly, so it adds no new crates
# beyond what `nisaba-app` already pulls into the workspace graph.
s3 = [
  "dep:aws-sdk-s3",
  "dep:aws-config",
  "dep:aws-credential-types",
]

[dependencies]
loro = "1.13"
tokio = { version = "1", features = ["full"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
bytes = "1"
thiserror = "2"
bitflags = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OIDC/JWT access resolution. `async-trait` is required for the object-safe
# async `AccessResolver` / `DocumentAuthorizer` / `HttpFetch` traits (held as
# `Arc<dyn ...>` in the registry). Both are already in the workspace graph via
# the app service, so they add no new registry entries.
async-trait = "0.1"
jsonwebtoken = "9"
# The shared Role vocabulary (token spellings + the app authorization
# endpoint's role answers). Vocabulary only — authorization policy stays in
# each service.
nisaba-auth = { path = "../../crates/nisaba-auth" }

# Server-only deps (kept optional so the pure CRDT core is testable headless).
axum = { version = "0.8", features = ["ws"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["trace", "cors"], optional = true }
tokio-tungstenite = { version = "0.30", optional = true }
# rustls (never openssl) to satisfy cargo-deny; same feature set as the app
# service's HTTP client. Used by the server-gated JWKS refresher and the HTTP
# document-authorization verifier.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
# Internal read API credential check: SHA-256 digest + constant-time compare,
# mirroring the app service's `/internal/*` token check exactly. Both crates
# are already in the workspace graph via the app service.
sha2 = "0.10"
subtle = "2"

# S3-backed durable stores (feature `s3`): the aws-sdk feature set mirrors the
# app service's `S3BlobStore` wiring — `default-features = false` drops only
# the legacy rustls/ring connector (see the comment in services/app/Cargo.toml),
# and `default-https-client` + `http-1x` select the hyper-1 + aws-lc-rs stack
# already in the graph. `aws-config`/`aws-credential-types` are likewise
# already present via the app service.
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "rt-tokio", "default-https-client"], optional = true }
aws-config = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.30"
base64 = "0.22"
