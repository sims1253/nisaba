[package]
name = "nisaba-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
aws-config = "1"
aws-credential-types = "1"
# default-features = false drops only the `rustls` default feature, which
# forces the legacy hyper-0.14/ring connector (aws-smithy-runtime/tls-rustls)
# and with it the unmaintained h2 0.3 line (RUSTSEC-2026-0258). Everything
# else from the default set is re-enabled explicitly; TLS comes from
# default-https-client (hyper-1 + aws-lc-rs, already in the graph).
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "rt-tokio", "default-https-client"] }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
hex = "0.4.3"
http = "1"
jsonwebtoken = "9"
nisaba-auth = { path = "../../crates/nisaba-auth" }
nisaba-core = { path = "../../crates/nisaba-core" }
nisaba-export = { path = "../../crates/nisaba-export" }
nisaba-references = { path = "../../crates/nisaba-references" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls", "uuid"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tower = "0.5"

[lints]
workspace = true
