[package]
name = "nisaba-core-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WebAssembly projection wrapper around nisaba-core for the web client."

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nisaba-core = { path = "../nisaba-core" }
nisaba-references = { path = "../nisaba-references" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# wasm-bindgen-test 0.3.77 pins `wasm-bindgen =0.2.127` exactly (the 0.2.x
# test crate line stopped at 0.2.50). The wasm-bindgen-cli used to run the
# wasm test suite must match the wasm-bindgen crate version — CI installs
# 0.2.127 to match; the runner rejects a mismatched crate version.
wasm-bindgen = "0.2.127"

[dev-dependencies]
wasm-bindgen-test = "0.3.77"
