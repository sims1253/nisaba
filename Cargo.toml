[workspace]
resolver = "2"
members = [
  "crates/nisaba-core",
  "crates/nisaba-references",
  "crates/nisaba-export",
  "services/app",
  "services/compile",
  "services/sync",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.94"
authors = ["Nisaba contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
