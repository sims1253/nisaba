# Security headers for the Nisaba web server (nginx).
#
# Included at server level AND inside every location that declares its own
# add_header: nginx `add_header` directives at a lower level REPLACE (not
# merge with) the enclosing level, so e.g. the /assets/ Cache-Control block
# would silently drop these headers without the re-include.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options      "DENY"      always;
add_header Referrer-Policy      "strict-origin-when-cross-origin" always;

# Content-Security-Policy — REPORT-ONLY on purpose. Enforcing an unvalidated
# CSP against the real SPA (Vite bundle + WASM module + OIDC redirects/token
# calls + sync WebSocket) risks breaking the app, so this ships in
# report-only mode: deploy, collect violation reports against the real app,
# tighten/extend as needed, and only then switch this header to an enforcing
# Content-Security-Policy.
#
# Policy notes:
#   * connect-src 'self' also covers the same-origin /sync WebSocket (CSP 3
#     treats ws://same-origin as matching 'self').
#   * http://localhost:8090 is the DEV Keycloak issuer the browser calls for
#     the PKCE token exchange — replace with the real issuer origin (and https)
#     when enforcing in production.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:8090; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
