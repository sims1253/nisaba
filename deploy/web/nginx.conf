# Nisaba web — nginx runtime config (non-root, listens on :8080).
#
# Serves the built SPA, exposes /healthz, and reverse-proxies the app + sync
# services using lazy upstream resolution so nginx starts even if a backend is
# not yet up (Docker DNS resolves hostnames at request time).
#
# Routing contract (docs/architecture.md §4):
#   * /api/*   → app   (the CRUD /api prefix is STRIPPED so app receives clean
#                       paths like /projects; exact /api/compile is forwarded verbatim).
#   * /sync/*  → sync  (WebSocket upgrade; sync serves GET /sync/{doc_id}).
#   * compile  is NEVER proxied here — it is internal-only on svc-net, called
#              solely by app at compile:8080 with the shared compile token.
#
# Upstreams are the stable Compose service DNS names (app, sync). They are bound
# to nginx variables so resolution is deferred to request time — a static
# `proxy_pass http://app:8080` would make nginx fail to boot while a backend is
# still starting. Requires the `resolver` directive below.
#
# In production, front this with TLS termination; see docs/operations.md and
# docs/security.md.
#
# This file is included from the main nginx.conf's http {} block, so statements
# at the top level of this file live in the http context. limit_conn_zone /
# limit_req_zone may ONLY appear there — putting them inside the server block
# below is a config error.
limit_conn_zone $binary_remote_addr zone=sync_conn:10m;
limit_req_zone $binary_remote_addr:$http_host zone=sync_req:10m rate=30r/s;

server {
    listen       8080;
    server_name  _;

    # Docker's embedded DNS (available inside Compose networks).
    resolver 127.0.0.11 valid=30s ipv6=off;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---- Compression (brotli via gzip fallback) ----
    # ~3.8 MB first paint becomes ~1.2–1.5 MB. The WASM payload alone is 3 MB.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/xml
        image/svg+xml;

    # ---- Security headers ----
    # See nginx-security-headers.conf: the snippet must be re-included in every
    # location that declares its own add_header, because nginx add_header
    # directives at a lower level replace — not merge with — these.
    include /etc/nginx/security-headers.conf;

    # ---- Immutable cache for hash-named assets ----
    # Vite emits content-hashed filenames so these are safe to cache forever.
    # (Single explicit Cache-Control header — combining `expires` with an
    # add_header Cache-Control would emit two Cache-Control headers.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Re-include: this location's own add_header would otherwise drop the
        # security headers above.
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Lightweight liveness probe for container HEALTHCHECK / probes.
    location = /healthz {
        access_log off;
        # default_type (not add_header Content-Type, which would emit a second
        # Content-Type alongside nginx's own).
        default_type text/plain;
        # Re-include: nginx locations with no add_header of their own inherit
        # the server-level headers; kept here so the pattern is uniform and
        # future-proof if a header is ever added to this location.
        include /etc/nginx/security-headers.conf;
        return 200 "ok\n";
    }

    # ---- API: project/reference CRUD, export orchestration, compile ----
    # Compile is already an app route under /api/compile. Keep this exact path
    # verbatim; the general rule below strips /api for the browser CRUD calls.
    # Both API locations below set client_max_body_size 128m: app's fulltext
    # route accepts MAX_FULLTEXT_BYTES (64 MiB decoded) base64-wrapped in JSON,
    # so axum's body limit is 128 MiB (services/app/src/lib.rs,
    # DefaultBodyLimit = MAX_FULLTEXT_BYTES × 2). nginx's 1 MiB default would
    # 413 those uploads before they reach the app. If the app limit changes,
    # these must move with it.
    location = /api/compile {
        client_max_body_size 128m;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $app_upstream "app:8080";
        proxy_pass http://$app_upstream;
    }

    # The browser-facing CRUD API lives under /api/*; app serves unprefixed
    # routes (/projects, ...), so the /api prefix is rewritten away before
    # proxying (rewrite ... break; keeps the resolved upstream variable working).
    location /api/ {
        # set MUST come before rewrite...break: the break flag halts further
        # rewrite-module processing, so a later set would never execute and
        # $app_upstream would be empty (HTTP 500 "invalid URL prefix").
        set $app_upstream "app:8080";
        rewrite ^/api/(.*)$ /$1 break;
        # Keep in sync with the /api/compile location's upload-ceiling note.
        client_max_body_size 128m;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$app_upstream;
    }

    # ---- CRDT sync / presence over WebSocket ----
    # /sync/{doc_id} is forwarded verbatim to the sync service, which serves the
    # WebSocket upgrade at exactly that path.
    location /sync/ {
        # DoS hardening: cap concurrent sockets per client IP (16 — well above a
        # single browser's needs) and throttle connection-establishment to 30/s
        # with a small burst allowance. The sync service itself also bounds
        # handshake time and per-frame size/rate; these nginx limits are the first
        # line of defence in front of it (and apply to unauthenticated paths).
        limit_conn sync_conn 16;
        limit_req zone=sync_req burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        set $sync_upstream "sync:8080";
        proxy_pass http://$sync_upstream;
    }

    # ---- SPA fallback (history routing) ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
