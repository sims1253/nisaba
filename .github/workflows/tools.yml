name: tools

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      # fixtures/ holds the golden DOCX/manifest/skeleton files that
      # tools/verify.sh re-generates and compares against.
      - 'fixtures/**'
      - 'deploy/**'
      - 'docker-compose.yml'
      - '.env.example'
      - 'justfile'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'services/**'
      # web/package.json (not web/**): the workspace-root bun install below
      # covers web's manifest, so dependency changes still gate this workflow,
      # but web-only source changes are web.yml's signal, not ours.
      - 'web/package.json'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.base.json'
      - 'docs/architecture.md'
      - 'scripts/**'
      - '.github/workflows/tools.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'fixtures/**'
      - 'deploy/**'
      - 'docker-compose.yml'
      - '.env.example'
      - 'justfile'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'services/**'
      - 'web/package.json'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.base.json'
      - 'docs/architecture.md'
      - 'scripts/**'
      - '.github/workflows/tools.yml'
  schedule:
    # Weekly full run (incl. the external-tool job) regardless of activity.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: tools-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect which areas changed so the heavyweight external-tool job only runs
  # when it can actually contribute signal (or when explicitly requested).
  changes:
    runs-on: ubuntu-latest
    outputs:
      external: ${{ steps.filter.outputs.external }}
      infra: ${{ steps.filter.outputs.infra }}
      app: ${{ steps.filter.outputs.app }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            external:
              - 'tools/src/pdf/**'
              - 'tools/src/visualdiff/**'
              - 'tools/src/externals/**'
              - 'tools/test/external-gated.test.ts'
            infra:
              - 'deploy/**'
              - 'docker-compose.yml'
              - '.env.example'
            app:
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - 'services/**'
              - 'web/**'
              - 'deploy/**'
              - 'docker-compose.yml'
              - '.env.example'
            docker:
              - 'deploy/Dockerfile*'
              - 'deploy/Dockerfile.*'
              - 'docker-compose.yml'
              - '.env.example'

  # Strict tools gate (bun). Runs the typecheck + every unit test EXCEPT the
  # external-tool suite, which needs LibreOffice/poppler/qpdf/ImageMagick and
  # lives in its own job below. No silent skipping: a missing script or failing
  # assertion fails the build.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3'
      # setup-bun has no dependency-cache input (it only caches the bun binary),
      # so cache the global bun install cache ourselves, keyed on the lockfile.
      - name: Cache bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies (workspace root, frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
        working-directory: tools
      - name: Unit tests (external-tool suite excluded; runs in external-pdf-tools)
        run: bun run test -- --exclude 'test/external-gated.test.ts'
        working-directory: tools

  # External PDF toolchain — an EXPLICIT, GATED job. It installs the real system
  # tools (LibreOffice, poppler, qpdf, ImageMagick) + typst and runs the full
  # tools/verify.sh, which exercises the external-gated PDF-compliance and
  # visual-diff tests FOR REAL (no skip). Runs on dispatch/schedule, on main,
  # and on PRs that touch the PDF/visual-diff/external-capability code.
  external-pdf-tools:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.ref == 'refs/heads/main' ||
      needs.changes.outputs.external == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install external PDF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice poppler-utils qpdf imagemagick
      # typst is PINNED to the same version the compile service builds with
      # (services/compile/Cargo.toml: typst = "0.15.1"), and the tarballs are
      # verified against SHA256 checksums before install — a floating
      # releases/latest would test against an untested typst with no
      # integrity check.
      - name: Install typst (for the skeleton-compile check in verify.sh)
        env:
          TYPST_VERSION: '0.15.1'
        run: |
          arch=$(uname -m)
          case "$arch" in
            x86_64) asset="typst-x86_64-unknown-linux-musl"
                    expected_sha256="a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c";;
            aarch64) asset="typst-aarch64-unknown-linux-musl"
                     expected_sha256="5aa8d74a3d906e60ea12a66ac2f37f8eef1b14cbad7182a745e393a10c23dcee";;
            *) echo "Unsupported arch: $arch"; exit 1;;
          esac
          url="https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/${asset}.tar.xz"
          echo "Installing typst v${TYPST_VERSION} ($asset) with SHA256 verification"
          curl -fsSL -o "/tmp/${asset}.tar.xz" "$url"
          echo "${expected_sha256}  /tmp/${asset}.tar.xz" | sha256sum --check --strict -
          tar xJf "/tmp/${asset}.tar.xz" -C /tmp
          sudo install -m755 "$(find /tmp -name typst -type f | head -1)" /usr/local/bin/typst
          typst --version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3'
      - name: Cache bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies (workspace root, frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Full tools/verify.sh (external-gated tests run for real)
        run: ./verify.sh
        working-directory: tools

  # Infra hygiene for files this stream owns: validate the resolved Compose
  # config (temp env from .env.example) and lint the bootstrap/ops shell scripts.
  infra-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate docker-compose.yml (temp env from .env.example)
        run: ./deploy/validate-compose.sh

      - name: Check architecture.md matches workspace
        run: ./scripts/check-architecture.sh

      - name: Shellcheck deploy scripts (install if absent)
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck \
            scripts/cargo-audit.sh \
            scripts/check-architecture.sh \
            scripts/wait-healthy.sh \
            deploy/validate-compose.sh \
            deploy/smoke.sh \
            deploy/e2e-app.sh \
            deploy/backup/backup.sh \
            deploy/backup/restore.sh \
            deploy/backup/verify.sh \
            deploy/postgres/init/10-init-databases.sh \
            deploy/seaweedfs/init-buckets.sh \
            deploy/seaweedfs/generate-s3-identities.sh \
            deploy/keycloak/healthcheck.sh

  smoke:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.ref == 'refs/heads/main' ||
      needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Smoke-test the infra tier
        run: ./deploy/smoke.sh

  compose-build:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.ref == 'refs/heads/main' ||
      needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the app-profile images (app/sync/compile/web)
        run: |
          tmp="$(mktemp)"
          cp .env.example "$tmp"
          docker compose --env-file "$tmp" --profile app build
          rm -f "$tmp"
