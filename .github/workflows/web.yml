name: web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.base.json'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.base.json'
      - '.github/workflows/web.yml'
  workflow_dispatch:

concurrency:
  # PR runs key on the PR number so a new push supersedes the stale run for
  # the same PR. Pushes to main and manual dispatches share the ref-keyed
  # group but queue instead of cancelling, so an in-flight run finishes and
  # saves its bun cache for the queued one.
  group: web-${{ github.event_name == 'pull_request' && github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Strict: install happens at the workspace root (single bun.lock), then
  # scripts run inside the web package. There is no "skip if absent" fallback.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3'

      # setup-bun has no dependency-cache input (it only caches the bun binary),
      # so cache the global bun install cache ourselves, keyed on the lockfile.
      - name: Cache bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies (workspace root, frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
        working-directory: web

      - name: Build
        run: bun run build
        working-directory: web

      - name: Test
        run: bun run test
        working-directory: web
