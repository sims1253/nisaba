name: security

on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'package.json'
      - 'web/package.json'
      - 'tools/package.json'
      - 'bun.lock'
      - 'deny.toml'
      - 'scripts/cargo-audit.sh'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'package.json'
      - 'web/package.json'
      - 'tools/package.json'
      - 'bun.lock'
      - 'deny.toml'
      - 'scripts/cargo-audit.sh'
      - '.github/workflows/security.yml'
  schedule:
    # Weekly scan of the advisory DB regardless of activity.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # RustSec advisory scan. cargo-deny (licence/ban/source policy) runs in
  # rust.yml; this job is specifically for the vulnerability database. Cargo.lock
  # IS committed; cargo audit reads the committed graph, so the scan covers
  # exactly the dependency set the lockfile pins (no generate-lockfile needed).
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: ./scripts/cargo-audit.sh

  bun-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      - run: bun install --frozen-lockfile
      - run: bun audit

  # GitHub native dependency review on pull requests (blocks known-vulnerable
  # dependency changes at the gate).
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # continue-on-error: this requires GitHub Advanced Security (dependency
      # graph) which may not be enabled on all forks/instances.
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
