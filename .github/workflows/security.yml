name: security

on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'package.json'
      - 'web/package.json'
      - 'tools/package.json'
      - 'bun.lock'
      - 'deny.toml'
      - 'scripts/cargo-audit.sh'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'package.json'
      - 'web/package.json'
      - 'tools/package.json'
      - 'bun.lock'
      - 'deny.toml'
      - 'scripts/cargo-audit.sh'
      - '.github/workflows/security.yml'
  schedule:
    # Weekly scan of the advisory DB regardless of activity.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # RustSec advisory scan. cargo-deny (licence/ban/source policy) runs in
  # rust.yml; this job is specifically for the vulnerability database. Cargo.lock
  # IS committed; cargo audit reads the committed graph, so the scan covers
  # exactly the dependency set the lockfile pins (no generate-lockfile needed).
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-audit
      - run: ./scripts/cargo-audit.sh

  bun-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3'
      # setup-bun has no dependency-cache input (it only caches the bun binary),
      # so cache the global bun install cache ourselves, keyed on the lockfile.
      - name: Cache bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun audit

  # GitHub native dependency review on pull requests (blocks known-vulnerable
  # dependency changes at the gate).
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # continue-on-error: this requires GitHub Advanced Security (dependency
      # graph) which may not be enabled on all forks/instances.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        continue-on-error: true
