name: rust

on:
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      # Migrations are compiled into the binaries via sqlx::migrate! and run
      # by tests — a migrations-only change alters the built/tested behavior
      # and must not skip CI.
      - 'migrations/**'
      - 'rustfmt.toml'
      - 'deny.toml'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'migrations/**'
      - 'rustfmt.toml'
      - 'deny.toml'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The workspace sets pedantic lints (Cargo.toml [workspace.lints.clippy]).
      # RUSTFLAGS=-D warnings makes them fail the build.
      # Cargo.lock IS committed. --locked verifies it matches the manifests and
      # fails if it would need regenerating, so it must not be regenerated first.
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # --locked builds against the committed Cargo.lock and fails on drift.
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked

  # Parity guard for the wasm projection wrapper (issue #20 stage 1): the
  # golden projection fixtures must hold through the wasm-bindgen boundary on
  # wasm32, not only natively. The test-runner binary version must match the
  # wasm-bindgen crate version pinned via wasm-bindgen-test
  # (crates/nisaba-core-wasm/Cargo.toml).
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94
        with:
          # Explicit toolchain: without it the action derives 1.94.1, while
          # rust-toolchain.toml resolves cargo to the "1.94" toolchain — two
          # different rustup directories, so the wasm32 std landed where cargo
          # never looked (E0463: can't find crate for `core`).
          toolchain: "1.94"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: wasm-bindgen-cli@0.2.127
      # Clippy on the wasm target covers the target-specific cfg code the
      # native clippy job never compiles.
      - run: cargo clippy -p nisaba-core-wasm --target wasm32-unknown-unknown --all-targets --locked
      - run: cargo test -p nisaba-core-wasm --target wasm32-unknown-unknown --locked
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Licences, advisories, bans, and sources are a blocking policy gate.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
